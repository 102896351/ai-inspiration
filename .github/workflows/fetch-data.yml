name: Fetch External AI Image Data

# 手动触发：在 GitHub 仓库 Actions 页选 "Fetch External AI Image Data" → Run workflow
# 用途：在 Actions runner（有公网出网）跑 fetch 脚本，下载 Civitai/PromptHero/Lexica
#      的 metadata + 图片到 raw_data/ 和 public/covers/，产出 PR 等用户审阅

on:
  workflow_dispatch:
    inputs:
      source:
        description: 'Which source to fetch (comma-separated; all = civitai,prompthero,lexica)'
        required: false
        default: 'civitai,prompthero,lexica'
        type: choice
        options:
          - civitai,prompthero,lexica
          - civitai
          - prompthero
          - lexica
      civitai_target:
        description: 'Civitai target count (capped by API page limit)'
        required: false
        default: '10'
        type: string
      lexica_target:
        description: 'Lexica target count'
        required: false
        default: '10'
        type: string
      prompthero_limit:
        description: 'Per-category limit for PromptHero (lower = fewer pages fetched)'
        required: false
        default: '3'
        type: string
      civitai_sort:
        description: 'Civitai sort: Newest | Most Reactions | Most Comments (default Newest, was empty in Month window)'
        required: false
        default: 'Newest'
        type: choice
        options:
          - Newest
          - Most Reactions
          - Most Comments
      civitai_period:
        description: 'Civitai period: AllTime | Year | Month | Week | Day (default AllTime)'
        required: false
        default: 'AllTime'
        type: choice
        options:
          - AllTime
          - Year
          - Month
          - Week
          - Day

concurrency:
  group: fetch-data
  cancel-in-progress: false

permissions:
  contents: write
  pull-requests: write

jobs:
  fetch:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      MAX_RETRIES: '3'
      RATE_LIMIT_MS: '1500'
      DOWNLOAD_IMAGES: 'true'
      CIVITAI_TARGET: ${{ inputs.civitai_target }}
      LEXICA_TARGET: ${{ inputs.lexica_target }}
      PROMPTHERO_PER_CAT: ${{ inputs.prompthero_limit }}
      CIVITAI_SORT: ${{ inputs.civitai_sort }}
      CIVITAI_PERIOD: ${{ inputs.civitai_period }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Create branch
        id: branch
        run: |
          BR="data/fetch-$(date +%Y%m%d-%H%M%S)"
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git checkout -b "$BR"
          echo "name=$BR" >> "$GITHUB_OUTPUT"

      - name: Connectivity check
        id: conn
        timeout-minutes: 2
        run: |
          echo "::group::Probing target sites"
          node -e "
          const tests = [
            { url: 'https://civitai.com/api/v1/images?limit=1&nsfw=None', name: 'Civitai API' },
            { url: 'https://prompthero.com/midjourney-prompts', name: 'PromptHero' },
            { url: 'https://lexica.art/api/v1/search?q=test', name: 'Lexica API' }
          ];
          (async () => {
            for (const t of tests) {
              try {
                const r = await fetch(t.url, { signal: AbortSignal.timeout(10000), headers: { 'User-Agent': 'AIGallery-Probe/1' } });
                const text = r.ok ? await r.text() : '';
                console.log(\`  \${t.name}: HTTP \${r.status}, body \${text.length} chars\`);
              } catch (e) {
                console.log(\`  \${t.name}: FAIL \${e.message.split('\n')[0]}\`);
              }
            }
          })();
          "
          echo "::endgroup::"

      - name: Fetch Civitai
        if: ${{ contains(inputs.source, 'civitai') }}
        continue-on-error: true
        timeout-minutes: 15
        run: |
          echo "::group::Civitai fetch"
          node scripts/fetch-civitai.js 2>&1 | tee civitai.log
          echo "::endgroup::"

      - name: Fetch PromptHero
        if: ${{ contains(inputs.source, 'prompthero') }}
        continue-on-error: true
        timeout-minutes: 15
        run: |
          echo "::group::PromptHero fetch"
          node scripts/fetch-prompthero.js 2>&1 | tee prompthero.log
          echo "::endgroup::"

      - name: Fetch Lexica
        if: ${{ contains(inputs.source, 'lexica') }}
        continue-on-error: true
        timeout-minutes: 10
        run: |
          echo "::group::Lexica fetch"
          node scripts/fetch-lexica.js 2>&1 | tee lexica.log
          echo "::endgroup::"

      - name: Summary
        if: always()
        run: |
          echo "## 📊 Fetch Summary" >> "$GITHUB_STEP_SUMMARY"
          for f in raw_data/*.json; do
            [ -f "$f" ] || continue
            cnt=$(node -e "try{console.log(JSON.parse(require('fs').readFileSync('$f','utf8')).length)}catch{console.log('?')}")
            echo "- \`$f\`: **$cnt** items" >> "$GITHUB_STEP_SUMMARY"
          done
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "### Covers downloaded" >> "$GITHUB_STEP_SUMMARY"
          png_count=$(find public/covers -name 'civitai-*' -type f 2>/dev/null | wc -l)
          ph_count=$(find public/covers -name 'prompthero-*' -type f 2>/dev/null | wc -l)
          lx_count=$(find public/covers -name 'lexica-*' -type f 2>/dev/null | wc -l)
          echo "- Civitai: $png_count" >> "$GITHUB_STEP_SUMMARY"
          echo "- PromptHero: $ph_count" >> "$GITHUB_STEP_SUMMARY"
          echo "- Lexica: $lx_count" >> "$GITHUB_STEP_SUMMARY"

      - name: Check if there are changes
        id: check_changes
        run: |
          echo "=== git status (untracked + modified) ==="
          git status --short
          echo "=== /check ==="
          if [ -z "$(git status --porcelain)" ]; then
            echo "has_changes=false" >> "$GITHUB_OUTPUT"
            echo "No changes detected"
          else
            echo "has_changes=true" >> "$GITHUB_OUTPUT"
            echo "Changes detected (see above)"
          fi

      - name: Commit and push
        if: steps.check_changes.outputs.has_changes == 'true'
        run: |
          set -e
          echo "=== git status BEFORE add ==="
          git status --short
          echo "=== adding files ==="
          git add raw_data/ public/covers/
          # Also add .log artifacts if they exist
          for f in civitai.log prompthero.log lexica.log; do
            [ -f "$f" ] && git add "$f" || true
          done
          echo "=== git status AFTER add ==="
          git status --short
          echo "=== committing ==="
          git commit -m "data: fetch from external AI image sources (civitai/prompthero/lexica)

          - Generated by GitHub Actions workflow 'Fetch External AI Image Data'
          - Trigger: ${{ inputs.source }}
          - See workflow logs for per-source stats"
          echo "=== pushing ==="
          git push -u origin "${{ steps.branch.outputs.name }}"
          echo "=== push done ==="

      - name: Create Pull Request
        if: steps.check_changes.outputs.has_changes == 'true'
        uses: actions/github-script@v7
        with:
          script: |
            const branch = '${{ steps.branch.outputs.name }}';
            const { data: pr } = await github.rest.pulls.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title: `data: external fetch from ${{ inputs.source }}`,
              head: branch,
              base: 'main',
              body: [
                '## 🤖 Auto-generated by `Fetch External AI Image Data` workflow',
                '',
                '**Sources**: `${{ inputs.source }}`',
                '**Branch**: `' + branch + '`',
                '',
                '### What changed',
                '- `raw_data/*.json` — original metadata (prompt, author, sourceUrl)',
                '- `public/covers/<source>-*` — downloaded images (webp/png/jpg)',
                '',
                '### ⚠️ Before merging',
                '- [ ] Verify image copyright attribution is preserved in metadata',
                '- [ ] Spot-check 5–10 covers for quality (not blank, not NSFW, not 404)',
                '- [ ] Verify counts match targets (Civitai ${{ inputs.civitai_target }}, Lexica ${{ inputs.lexica_target }})',
                '',
                '### Next step after merge',
                'Run `rewrite-content.js` to transform raw → entry format, then integrate + deploy.',
              ].join('\n')
            });
            console.log('PR created:', pr.html_url);